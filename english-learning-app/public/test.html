<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タップテスト</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 { font-size: 20px; text-align: center; }
    button {
      width: 100%;
      max-width: 300px;
      padding: 24px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }
    #btn1 { background: #4f46e5; color: white; }
    #btn2 { background: #059669; color: white; }
    #result {
      font-size: 18px;
      color: #fbbf24;
      min-height: 30px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>📱 iPhone タップテスト</h1>
  <button id="btn1" onclick="document.getElementById('result').textContent='✅ ボタン1 動作OK!'">
    ボタン1をタップ
  </button>
  <button id="btn2" onclick="document.getElementById('result').textContent='✅ ボタン2 動作OK!'">
    ボタン2をタップ
  </button>
  <div id="result">← どちらかをタップしてください</div>
  <p style="color:#64748b; font-size:13px; text-align:center">
    このページは React を使わない<br>プレーンHTMLです
  </p>
</body>
</html>
